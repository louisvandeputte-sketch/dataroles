{% extends "base.html" %}

{% block title %}Jobs (24h) - everyjob{% endblock %}

{% block content %}
<div x-data="jobsRecentPage()" class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Jobs (laatste 24u)</h1>
            <p class="text-gray-600 mt-1">
                <span x-text="jobs.length"></span> jobs gevonden in de laatste <span x-text="hours"></span> uur
            </p>
        </div>
        <button @click="loadJobs" :disabled="loading"
                class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50">
            <i data-lucide="refresh-cw" class="w-4 h-4 mr-2" :class="{ 'animate-spin': loading }"></i>
            Refresh
        </button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Titel</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Bedrijf</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Scrape run</th>
                    <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Bron</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Search type</th>
                    <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Title check</th>
                    <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Posted</th>
                    <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-100">
                <template x-if="loading">
                    <tr>
                        <td colspan="8" class="px-6 py-12 text-center text-gray-500">
                            <i data-lucide="loader" class="w-6 h-6 inline-block mr-2 animate-spin"></i>
                            Data ophalen...
                        </td>
                    </tr>
                </template>

                <template x-if="!loading && jobs.length === 0">
                    <tr>
                        <td colspan="8" class="px-6 py-12 text-center text-gray-400">
                            <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2"></i>
                            Geen jobs gevonden in de laatste 24 uur
                        </td>
                    </tr>
                </template>

                <template x-for="(job, index) in jobs" :key="`${job.job_id}-${job.detected_at || index}`">
                    <tr :class="job.title_classification === 'Data' && job.is_new ? 'bg-green-50 hover:bg-green-100' : 'hover:bg-indigo-50'">
                        <td class="px-4 py-3">
                            <div class="text-sm font-medium text-gray-900" x-text="job.title"></div>
                            <div class="text-xs text-gray-500" x-text="formatRelative(job.detected_at)"></div>
                        </td>
                        <td class="px-4 py-3 text-sm text-gray-800" x-text="job.company_name || '-' "></td>
                        <td class="px-4 py-3 text-sm text-gray-800">
                            <div class="font-medium" x-text="job.run_search_query || 'Onbekend'"></div>
                            <div class="text-xs text-gray-500" x-text="formatExact(job.run_started_at)"></div>
                        </td>
                        <td class="px-3 py-3">
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                                  :class="job.run_source === 'linkedin' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'"
                                  x-text="(job.run_source || 'unknown').toUpperCase()"></span>
                        </td>
                        <td class="px-4 py-3">
                            <template x-if="job.job_types && job.job_types.length">
                                <div class="flex flex-wrap gap-1">
                                    <template x-for="type in job.job_types" :key="type.id">
                                        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium text-white"
                                              :style="`background-color: ${type.color || '#4b5563'}`"
                                              x-text="type.name"></span>
                                    </template>
                                </div>
                            </template>
                            <template x-if="!job.job_types || job.job_types.length === 0">
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                                      :class="job.title_classification === 'Data' ? 'bg-green-100 text-green-800' : (job.title_classification === 'NIS' ? 'bg-gray-100 text-gray-700' : 'bg-yellow-100 text-yellow-800')"
                                      x-text="job.title_classification || 'Onbekend'"></span>
                            </template>
                        </td>
                        <td class="px-3 py-3">
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold"
                                  :class="job.title_classification === 'Data' ? 'bg-green-50 text-green-700 border border-green-200' : (job.title_classification === 'NIS' ? 'bg-gray-100 text-gray-700 border border-gray-200' : 'bg-yellow-50 text-yellow-700 border border-yellow-200')"
                                  x-text="job.title_classification || 'Pending'"></span>
                        </td>
                        <td class="px-3 py-3 text-sm text-gray-800" x-text="formatExact(job.posted_date)"></td>
                        <td class="px-3 py-3">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold"
                                  :class="job.is_new ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'"
                                  x-text="job.is_new ? 'New' : 'Update'"></span>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function jobsRecentPage() {
    return {
        jobs: [],
        hours: 24,
        loading: false,
        async loadJobs() {
            this.loading = true;
            try {
                const response = await fetch(`/api/jobs/recent?hours=${this.hours}&limit=500`);
                const data = await response.json();
                this.jobs = data.jobs || [];
                this.hours = data.hours || this.hours;
            } catch (error) {
                console.error('Failed to load recent jobs', error);
                alert('Kon gegevens niet ophalen. Probeer opnieuw.');
            } finally {
                this.loading = false;
                this.$nextTick(() => lucide.createIcons());
            }
        },
        formatExact(dateString) {
            if (!dateString) return '-';
            const d = new Date(dateString);
            return d.toLocaleDateString('nl-BE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        },
        formatRelative(dateString) {
            if (!dateString) return '-';
            const d = new Date(dateString);
            const diffMs = Date.now() - d.getTime();
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            if (diffHours < 1) {
                const minutes = Math.max(1, Math.floor(diffMs / (1000 * 60)));
                return `${minutes} min geleden`;
            }
            if (diffHours < 24) {
                return `${diffHours}u geleden`;
            }
            const diffDays = Math.floor(diffHours / 24);
            return `${diffDays}d geleden`;
        },
        async init() {
            await this.loadJobs();
        }
    };
}
</script>
{% endblock %}
